# @format

name: Generate protobuf-c

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: generate-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-c:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install protobuf-c compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format protobuf-compiler protobuf-c-compiler

      - name: Generate C bindings
        run: |
          ./scripts/generate-c.sh

      - name: Upload generated bindings
        uses: actions/upload-artifact@v6
        with:
          name: rr1-messages-generated
          path: generated/

  # Artifacts expire, releases do not. Publish the generated bindings as a
  # release asset on main (rolling `latest` release) and on v* tags (pinned,
  # immutable-by-convention releases).
  release:
    needs: generate-c
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download generated bindings
        uses: actions/download-artifact@v8
        with:
          name: rr1-messages-generated
          path: generated

      - name: Package release asset
        run: |
          (cd generated && zip -r ../rr1-messages-generated.zip .)
          unzip -l rr1-messages-generated.zip

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest rr1-messages-generated.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest generated bindings" \
            --notes "protobuf-c bindings generated from ${GITHUB_SHA}. This release is replaced on every push to main; pin a v* tag release for reproducible builds."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" rr1-messages-generated.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "protobuf-c bindings generated from ${GITHUB_SHA}."
